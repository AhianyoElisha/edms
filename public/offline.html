<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12233f" />
    <title>Offline - Ezar Delivery Services</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #12233f; color: #fff; text-align: center; padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      img { width: 120px; height: 120px; border-radius: 24px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { margin: 0 0 24px; opacity: 0.8; line-height: 1.5; max-width: 320px; }
      button {
        border: 0; border-radius: 8px; padding: 14px 28px; font-size: 16px; font-weight: 600;
        background: #fff; color: #12233f; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>No internet connection</h1>
      <p>Ezar Delivery Services needs a connection to load. Check your data or Wi-Fi and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
