# Runs beside the self-hosted Appwrite on the VPS and is published through
# Appwrite's own Traefik, so it shares api.edsghana.com and its certificate:
#
#   https://api.edsghana.com/ocr/health   -> GET  /health
#   https://api.edsghana.com/ocr/ocr      -> POST /ocr   (Bearer OCR_SERVICE_TOKEN)
#
# Traefik ranks routers by rule length, and Appwrite's console rule is longer
# than this one, so the priority is set outright. Appwrite has no /ocr path.

services:
  manifest-ocr:
    build: .
    image: manifest-ocr:latest
    container_name: manifest-ocr
    restart: unless-stopped
    env_file: .env # OCR_SERVICE_TOKEN=... (chmod 600, not in git)
    environment:
      OCR_THREADS: "2"
    # Appwrite shares the box; keep OCR from starving it.
    cpus: 1.5
    mem_limit: 1536m
    networks:
      - gateway
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=appwrite
      - traefik.docker.network=appwrite
      - traefik.http.services.manifest_ocr.loadbalancer.server.port=8000
      - traefik.http.middlewares.manifest_ocr_strip.stripprefix.prefixes=/ocr
      - traefik.http.routers.manifest_ocr.entrypoints=appwrite_websecure
      - traefik.http.routers.manifest_ocr.rule=Host(`api.edsghana.com`) && PathPrefix(`/ocr`)
      - traefik.http.routers.manifest_ocr.tls=true
      - traefik.http.routers.manifest_ocr.priority=1000
      - traefik.http.routers.manifest_ocr.middlewares=manifest_ocr_strip
      - traefik.http.routers.manifest_ocr.service=manifest_ocr

networks:
  gateway:
    name: appwrite
    external: true
